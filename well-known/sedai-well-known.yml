generated: '2026-08-29'
method: probed
source: >-
  Live probes of every Sedai host named in apis.yml and in Sedai's own SDK
  documentation: sedai.io (website), docs.sedai.io (GitBook docs),
  app.sedai.io (the console / signup host). The API itself is served per-tenant
  at https://{tenant}.sedai.app, which cannot be probed anonymously without a
  tenant name, so it is recorded here as untested rather than as a miss.
description: >-
  Every /.well-known/ path returned 404 on sedai.io and docs.sedai.io.
  app.sedai.io answers HTTP 200 with a text/html single-page-app shell for
  /.well-known/openid-configuration, /oauth-authorization-server,
  /oauth-protected-resource and /api-catalog — that is the SPA catch-all, not a
  document, so those are recorded as present-but-not-a-real-document and NOT
  credited. No /.well-known/ pointer is emitted in apis.yml, because nothing on
  any Sedai host served a real discovery document.
hosts:
