untested_hosts:
  - host: https://{tenant}.sedai.app
    reason: >-
      Sedai's API is served from a per-customer tenant subdomain
      (SEDAI_BASE_URL, e.g. https://your-org.sedai.app). There is no anonymous
      tenant to probe, so no /.well-known/ claim is made about the API host in
      either direction.
