source: >-
  https://github.com/SedaiEngineering/sedai-sdk-releases (README.md +
  CHANGELOG.md + CHANGELOG-typescript.md), the published package archives in
  that repo, https://registry.terraform.io/v1/providers/SedaiEngineering/sedai,
  and https://sedaiengineering.github.io/helm-charts/index.yaml. Sedai's GitHub
  organization is SedaiEngineering, not "sedai" — confirmed by the install URLs
  printed in Sedai's own SDK README.
description: >-
  First-party Sedai client libraries and infrastructure packages. NOTHING SEDAI
  SHIPS IS ON A PUBLIC LANGUAGE REGISTRY. Neither SDK is published to PyPI or
  npm; both are installed directly from a GitHub raw URL that always serves the
  latest build ("sedai_sdk-latest.tar.gz" / "sedai-sdk-typescript-latest.tgz"),
  which Sedai's own README documents as a hazard — npm reports "up to date"
  while silently keeping an older copy, and npm ci fails on an integrity
  mismatch because the bytes behind a fixed URL change. A consumer therefore
  cannot pin a version through the documented install path. Both SDKs are
  licensed UNLICENSED / proprietary. The Terraform provider and the Helm chart
  ARE properly versioned and registry-distributed.
