aid: sedai
name: Sedai
description: >-
  Sedai is an autonomous cloud and AI optimization platform. It continuously
  analyzes application behavior — traffic, resource utilization, latency and
  errors — and then adjusts cloud configuration in real time to cut cost,
  improve performance and protect availability, across Kubernetes, VMs,
  serverless, storage, databases, GPUs and AI agent workloads on AWS, Azure and
  GCP. It operates in three modes: Datapilot (observe only), Copilot (human
  approves each change) and Autopilot (fully autonomous). Sedai exposes a
  tenant-scoped platform API at https://{tenant}.sedai.app reached through
  first-party Python and TypeScript SDKs, a Terraform provider and a Helm chart
  for its in-cluster Smart Agent, but publishes no OpenAPI and no public API
  reference on its documentation site.
