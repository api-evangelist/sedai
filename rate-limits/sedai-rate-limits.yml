    note: Full docs corpus searched — no rate-limit section, no numeric limit, no header name.
tags:
  - Cloud Optimization
  - FinOps
  - Rate Limiting
limit_count: 0
description: >-
  SEDAI PUBLISHES NO NUMERIC RATE LIMITS. What Sedai does document is the
  runtime behaviour on exhaustion: HTTP 429, which its SDKs retry automatically
  up to 3 times with exponential backoff (alongside 503 and 504). No limit, no
  window, no burst, no scope and no response header is stated anywhere public.
  This file replaces a 2026-05-04 bulk-sweep scaffold that had invented
  per-tier requests-per-minute and monthly quotas, and a full set of
  X-RateLimit-* headers, none of which Sedai has ever published.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No rate-limit response header is documented. An agent has no runtime signal
    of remaining budget — it can only observe the 429 after the fact.
responseCodes:
  throttled: 429
  transient: [503, 504]
limits: []
client_behaviour:
  retries: 3
  strategy: exponential backoff
  configurable: true
  mechanism: 'configure({ baseUrl, apiToken, retries })'
  applies_to: [429, 503, 504]
  caution: >-
    Because Sedai documents no idempotency key, this automatic retry replays
    write operations with no deduplication guarantee. See
    conventions/sedai-conventions.yml.
policies: []
gaps:
  - No published limit, window, burst or scope.
  - No rate-limit response headers, and no Retry-After.
  - No per-plan limits, because Sedai publishes no plans (plans/sedai-plans-pricing.yml).
maintainers:
