provider: Sedai
providerId: sedai
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: >-
  https://github.com/SedaiEngineering/sedai-sdk-releases/blob/main/REFERENCE-typescript.md
  (the "Common HTTP errors" table and the configure() retries option) —
  the only public statement Sedai makes about throttling.
sources:
  - url: https://github.com/SedaiEngineering/sedai-sdk-releases/blob/main/REFERENCE-typescript.md
    status: 200
    checked: '2026-08-29'
  - url: https://sedai.io/pricing
    status: 200
