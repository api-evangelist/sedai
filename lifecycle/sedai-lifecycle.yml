    functions: [submitBulkExecutionRequest, getExecutionStatus, getExecutionItems]
    status: >-
      Sedai states these are live-verified against the TEST environment only and
      the backing branch has not shipped to production. The documented
      production path remains bulkExecuteWithCopilot + getRecommendations.
    source: REFERENCE-typescript.md — Transaction-Level Bulk Execution Tracking
runtime_expiry:
