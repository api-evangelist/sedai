    fixes:
      - >-
        Documented that getCloudProviderIds() echoes unresolved ids back mapped
        to themselves rather than omitting them — existing backend behaviour,
        documentation only.
      - >-
        Corrected resourceId: it is a slash-delimited composite path, not an
        opaque res_abc123 token. Any validator written from the old documented
        shape rejected every real id.
    changes:
      - Source maps no longer published; tarball 83 KB -> 56 KB.
    additions:
