    fixes:
      - >-
        PaginationConfig.start is a 1-based PAGE NUMBER, not a record offset —
        the docs previously said the opposite, and following them silently
        returned data from the wrong part of the result set.
      - examples/typescript is now a self-contained npm project; the clone-and-run flow works.
