plan_count: 0
pricing_model: volume-based, custom quote
description: >-
  SEDAI PUBLISHES NO PLANS. There are no named tiers, no prices, no currency, no
  billing period and no quotas anywhere on https://sedai.io/pricing — the page
  carries an FAQ and a "Submit this form to get your custom quote" lead form,
  nothing more. This file replaces a 2026-05-04 bulk-sweep scaffold that had
  invented Free / Professional / Enterprise tiers with request quotas and rate
  limits Sedai has never published; none of those figures were real and they
  have been removed rather than carried forward.
plans: []
published_facts:
  - fact: Volume-based pricing
    detail: >-
      "Our pricing model is based on your unique cloud environment and usage, so
      that investing in Sedai is a no-brainer. Submit this form to get your
      custom quote."
    source: https://sedai.io/pricing
  - fact: Billing unit
    detail: >-
      Sedai denominates pricing in Sedai Billing Units (SBUs), with no overage
      penalties. Specific pricing is only available via sedai.io/demo.
    source: llms/sedai-llms.txt
  - fact: Free trial
    detail: 30-day free trial with full access to the platform.
    source: https://sedai.io/pricing
  - fact: No self-serve purchase
    detail: >-
      No checkout, no card-on-file signup path, no published price list. Every
      route to a price is a sales conversation. app.sedai.io/signup (HTTP 200)
      leads to a tenant provisioning flow, not a priced plan.
    source: https://sedai.io/pricing
api_pricing:
  metered: false
  note: >-
    The platform API is not separately priced or metered. It is included with
    the platform and reached at the customer's own tenant host
    (https://{tenant}.sedai.app); there is no API-only plan and no published
    per-call charge.
